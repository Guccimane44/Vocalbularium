services:
  - type: web
    name: vocabularium
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: "0.0.0.0"
      - key: DATA_DIR
        value: .data
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_MODEL
        value: deepseek-v4.1-flash
