\* One capture, two submits at once, two deck configurations, two browser
\* sessions, three worker lives, four requests: about 3.4 million states in
\* half a minute. The vocabularium-captures skill says what this leaves out.
\* scripts/check-captures.mjs runs this file; --break adds to Breaks.
CONSTANTS
  Captures = {c1}
  Procs = {p1, p2}
  Snaps = {s0, s1}
  MaxEpoch = 2
  MaxWorkers = 3
  MaxSends = 4
  Breaks = {}

SPECIFICATION Spec

INVARIANTS
  OnePage
  NeverLost
  SavedHasPage
  NeverReused
  Fenced
  InFlightNotInterrupted

CHECK_DEADLOCK FALSE
