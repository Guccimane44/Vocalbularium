name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check that the committed OpenAPI reference is current
        if: runner.os == 'Linux'
        run: npm run openapi && git diff --exit-code docs/api/openapi.json
      - run: node --test tests/extension.test.mjs tests/diagnostics.test.mjs
      - run: npm run build
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: local-candidate-${{ matrix.os }}
          path: artifacts/vocabularium-*-candidate.zip*
          if-no-files-found: error
          retention-days: 14
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://vocabularium_test:test-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create non-superuser fixture role
        env:
          PGPASSWORD: postgres-ci-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE vocabularium_test LOGIN CREATEDB NOSUPERUSER NOCREATEROLE PASSWORD 'test-ci-only'"
      - run: npm test
      # The browser download is quick; the system packages from the Ubuntu
      # mirror can take minutes. Cache both per runner image and Playwright
      # version, and install the cached packages offline on a hit.
      - name: Read Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser and system packages
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright system packages from cache
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: find ~/.cache/playwright-debs -name "*.deb" -exec sudo dpkg -i {} +
      - name: Install Playwright system packages
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-debs
          sudo rm -f /var/cache/apt/archives/*.deb
          npx playwright install-deps chromium
          mkdir -p ~/.cache/playwright-debs
          find /var/cache/apt/archives -maxdepth 1 -name "*.deb" -exec cp {} ~/.cache/playwright-debs/ \;
      - run: npx playwright install chromium
      - run: npm run test:browser
