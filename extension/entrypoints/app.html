<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vocabularium</title><link rel="stylesheet" href="../app.css"></head>
<body>
  <div class="shell">
    <nav id="sidebar" class="sidebar" aria-label="Decks" data-i18n="nav.decks" data-i18n-attribute="aria-label" hidden></nav>
    <div class="main-column">
      <header class="app-header">
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-controls="sidebar" aria-expanded="false" data-i18n="nav.decks" hidden>Decks</button>
        <a class="brand" id="header-brand" href="#">Vocabularium<span class="brand-mark">.</span></a>
        <div class="header-actions">
          <fieldset class="theme-control" id="theme-control"><legend data-i18n="settings.appearance">Appearance</legend><div class="segmented"><label data-i18n="settings.appearance.system" data-i18n-attribute="title" title="System"><input type="radio" name="theme" value="system"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H4z"/><path d="M9 20h6M12 16v4"/></svg><span class="visually-hidden" data-i18n="settings.appearance.system">System</span></label><label data-i18n="settings.appearance.light" data-i18n-attribute="title" title="Sage"><input type="radio" name="theme" value="light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="visually-hidden" data-i18n="settings.appearance.light">Sage</span></label><label data-i18n="settings.appearance.dark" data-i18n-attribute="title" title="Moss night"><input type="radio" name="theme" value="dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg><span class="visually-hidden" data-i18n="settings.appearance.dark">Moss night</span></label></div></fieldset>
          <p id="theme-error" class="error" role="alert"></p>
        </div>
      </header>
      <main id="app" aria-live="polite"><p data-i18n="app.opening">Opening your vocabulary…</p></main>
    </div>
  </div>
  <script type="module" src="../app.js"></script>
</body>
</html>
