<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabularium</title><link rel="stylesheet" href="popup.css"></head><body><header><span class="mark">V</span><span>VOCABULARIUM</span></header><main><h1>A word worth keeping.</h1><p id="status" role="status">Opening your library…</p><form id="capture"><label>Word or short expression<textarea id="expression" rows="2" required placeholder="What did you discover?"></textarea></label><button>Add to my library →</button></form><div class="row"><button id="study" class="secondary">Open my library</button><button id="sync" class="secondary">Sync</button></div><section><h2>Waiting to upload</h2><ul id="queue"></ul><button id="claim" class="secondary" hidden>Assign unsent captures to this account</button></section><details id="connection"><summary>Connect your account</summary><form id="settings"><label>Service address<input id="url" type="url" placeholder="https://your-vocabularium-site" required></label><label>Device token<input id="token" type="password" required autocomplete="off"></label><p class="hint">Create a device token in Vocabularium → Settings → Sync & devices.</p><button type="button" id="load">Load wordlists</button><label>Default wordlist<select id="list" required></select></label><button>Save connection</button></form><button id="disconnect" class="secondary">Disconnect this device</button></details></main><script type="module" src="popup.js"></script></body></html>
